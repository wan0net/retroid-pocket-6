# RP6-managed settings. RetroArch fills unspecified settings with its defaults.
input_driver = "android"
input_joypad_driver = "android"
input_autodetect_enable = "true"
config_save_on_exit = "false"
joypad_autoconfig_dir = "/storage/emulated/0/RetroArch/autoconfig"
input_overlay_enable = "false"
input_player1_joypad_index = "0"

# Explicit RP6 fallback bindings. These take priority over autoconfiguration.
input_player1_b_btn = "96"
input_player1_a_btn = "97"
input_player1_y_btn = "99"
input_player1_x_btn = "100"
input_player1_l_btn = "102"
input_player1_r_btn = "103"
input_player1_l2_btn = "104"
input_player1_r2_btn = "105"
input_player1_l3_btn = "106"
input_player1_r3_btn = "107"
input_player1_start_btn = "108"
input_player1_select_btn = "109"
input_player1_up_btn = "h0up"
input_player1_down_btn = "h0down"
input_player1_left_btn = "h0left"
input_player1_right_btn = "h0right"
input_player1_l_x_plus_axis = "+0"
input_player1_l_x_minus_axis = "-0"
input_player1_l_y_plus_axis = "+1"
input_player1_l_y_minus_axis = "-1"
input_player1_r_x_plus_axis = "+2"
input_player1_r_x_minus_axis = "-2"
input_player1_r_y_plus_axis = "+3"
input_player1_r_y_minus_axis = "-3"

# Hold Select for hotkeys: R3 menu, Start quit, R1 save, L1 load.
input_enable_hotkey_btn = "109"
input_menu_toggle_btn = "107"
input_exit_emulator_btn = "108"
input_save_state_btn = "103"
input_load_state_btn = "102"
quit_press_twice = "true"
menu_unified_controls = "true"
